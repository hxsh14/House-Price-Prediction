random_state: 42
test_size: 0.2
cv_folds: 5

paths:
  raw_data: data/raw/housing.csv
  processed_data: data/processed/housing_processed.csv
  models_dir: models/
  reports_dir: reports/
  eda_dir: reports/eda/

models:
  ridge:
    alpha: 1.0
  lasso:
    alpha: 0.1
  random_forest:
    n_estimators: 100
    max_depth: 10
  xgboost:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 6
